# Blueprint Render : Dashboard → New → Blueprint → choisir ce dépôt.
# La base de données est hébergée chez Neon (gratuite) : collez son adresse dans DATABASE_URL.
services:
  - type: web
    name: nexusecole
    runtime: docker
    plan: free
    region: frankfurt        # au plus près de Dakar et de la base Neon (Europe)
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/sante-plateforme
    envVars:
      - key: DATABASE_URL
        sync: false            # adresse Neon (connexion directe, sans « -pooler »)
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: DONNEES_DEMO
        value: "true"          # crée le « Lycée Démo » rempli ; mettre false pour un espace vide
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: BULLETIN_SIGNING_SECRET
        generateValue: true    # ne jamais la changer : les bulletins émis ne se vérifieraient plus
      - key: BASE_DOMAIN
        value: ecoles.nexusecole
      - key: PUBLIC_DOMAIN
        value: admin.ecoles.nexusecole
      - key: ALLOWED_HOSTS
        value: "*"
      - key: GUNICORN_WORKERS
        value: "2"
